<path d="M14,288 h24" stroke="#bfe9f5" stroke-width="8" stroke-dasharray="6 3"/><text x="44" y="292">薄冰桥（风暴封闭）</text>
<path d="M14,312 h24" stroke="#9fe7ff" stroke-width="5" stroke-dasharray="4 3"/><text x="44" y="316">可破冰墙</text>
<rect x="14" y="328" width="24" height="14" fill="#64554f"/><rect x="14" y="328" width="24" height="14" fill="#050d14" opacity=".35"/><text x="44" y="340">压暗 = 未探索迷雾</text>
</g>
<text x="16" y="380" class="lh">设计意图</text>
<g class="lg">
<text x="16" y="404">· 五个区域空间形状各不相同</text>
<text x="16" y="426">· 区域间只靠窄道、桥、坡相连</text>
<text x="16" y="448">· 台地观景点先看清全图结构</text>
<text x="16" y="470">· 东侧电池隔崖可见，需绕路</text>
<text x="16" y="492">· 滑坡单向，回程只能另找路</text>
<text x="16" y="514">· 捷径门打开后回家路程减半</text>
<text x="16" y="536">· 热脉裂谷暖和但敌人密集</text>
<text x="16" y="558">· 薄冰桥是近路，风暴时断开</text>
<text x="16" y="580">· 目标只在固定角落之间随机</text>
<text x="16" y="612" class="ts">所有位置均为草案，可调整</text>
</g>
