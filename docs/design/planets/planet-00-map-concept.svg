<text x="16" y="30" class="lh">图例</text>
<g class="lg">
<circle cx="26" cy="54" r="9" fill="#ffb35c"/><text x="44" y="58">安全屋 / 热源</text>
<circle cx="26" cy="80" r="9" fill="#55dfff"/><text x="44" y="84">气象信标（修复后成热源）</text>
