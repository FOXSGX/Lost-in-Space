<circle cx="26" cy="132" r="9" fill="#79d8ff"/><text x="44" y="136">★ 地标（各区一个）</text>
<circle cx="26" cy="158" r="9" fill="#c9a7ff"/><text x="44" y="162">? 隐藏补给 / 异常样本</text>
<circle cx="26" cy="184" r="9" fill="#ff6d78"/><text x="44" y="188">! 敌人巢穴</text>
<circle cx="26" cy="210" r="9" fill="#eaf8fc"/><text x="44" y="214">眼 高处观景点</text>
